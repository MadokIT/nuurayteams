<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nuurayteams — создавайте скриншоты страниц и отправляйте ссылки в WhatsApp."
    />
    <title>Nuurayteams</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0f172a;
        --bg-3: #111827;
        --panel: rgba(15, 23, 42, 0.78);
        --panel-strong: rgba(15, 23, 42, 0.96);
        --panel-soft: rgba(255, 255, 255, 0.04);
        --card: rgba(17, 24, 39, 0.92);
        --border: rgba(148, 163, 184, 0.18);
        --border-strong: rgba(148, 163, 184, 0.28);
        --text: #edf6ff;
        --muted: #a7bbd8;
        --green: #25d366;
        --green-soft: rgba(37, 211, 102, 0.14);
        --green-deep: #1aa85a;
        --blue: #3b82f6;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 32%),
          radial-gradient(circle at bottom right, rgba(37, 211, 102, 0.12), transparent 28%),
          linear-gradient(135deg, var(--bg), var(--bg-2) 52%, var(--bg-3));
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 18px;
      }

      .app {
        width: min(1160px, 100%);
        border-radius: 30px;
        overflow: hidden;
        background: rgba(7, 17, 31, 0.62);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 22px 28px 8px;
        flex-wrap: wrap;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 800;
        background: linear-gradient(135deg, var(--green), #9ae6b4);
        color: #07111f;
        box-shadow: 0 12px 30px rgba(37, 211, 102, 0.35);
      }

      .brand-name {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2rem);
        letter-spacing: 0.06em;
        font-weight: 800;
      }

      .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--green-soft);
        border: 1px solid rgba(37, 211, 102, 0.2);
        color: #b9f7cc;
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .live-pill::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px rgba(37, 211, 102, 0.9);
      }

      .main {
        display: grid;
        grid-template-columns: 1.3fr 0.9fr;
        gap: 24px;
        padding: 18px 28px 28px;
      }

      .left-panel,
      .right-panel {
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: 24px;
      }

      .left-panel {
        padding: 22px;
      }

      .headline {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 4rem);
        line-height: 1.06;
        letter-spacing: -0.05em;
      }

      .lead {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
        max-width: 58ch;
      }

      .input-area {
        margin-bottom: 18px;
      }

      .url-input {
        width: 100%;
        border: 1px solid var(--border-strong);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.03);
        padding: 18px 18px;
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .url-input:focus {
        border-color: rgba(59, 130, 246, 0.7);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
      }

      .url-input::placeholder {
        color: #90a3c5;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 14px 18px;
        font-size: 0.96rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--green), #90f0b0);
        color: #062c15;
        box-shadow: 0 18px 30px rgba(37, 211, 102, 0.22);
      }

      .secondary {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        color: var(--text);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 8px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 12px;
      }

      .stat .value {
        display: block;
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .stat .label {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .right-panel {
        padding: 18px;
      }

      .card-shell {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18);
      }

      .preview-card {
        display: none;
      }

      .preview-card.visible {
        display: block;
      }

      .preview-image {
        width: 100%;
        display: block;
        height: 260px;
        object-fit: cover;
        background: linear-gradient(135deg, #dfeaf8, #f8f9ff);
      }

      .preview-body {
        padding: 18px 18px 22px;
      }

      .preview-badge {
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.18);
        color: #cfe0ff;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .preview-title {
        margin: 0 0 12px;
        font-size: clamp(1.2rem, 2vw, 1.8rem);
        line-height: 1.2;
      }

      .preview-link {
        color: #8de9b4;
        text-decoration: none;
        word-break: break-all;
        font-weight: 700;
      }

      .history {
        margin-top: 20px;
      }

      .history-title {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .history-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .history-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 9px 12px;
        color: var(--text);
        cursor: pointer;
        font-size: 0.78rem;
        line-height: 1.2;
      }

      .history-empty {
        color: var(--muted);
        font-size: 0.82rem;
        opacity: 0.85;
      }

      @media (max-width: 820px) {
        .main {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 540px) {
        body {
          padding: 18px 12px;
        }

        .topbar,
        .main {
          padding-left: 16px;
          padding-right: 16px;
        }

        .actions {
          flex-direction: column;
        }

        .actions button {
          width: 100%;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo">N</div>
          <h1 class="brand-name">Nuurayteams</h1>
        </div>
        <div class="live-pill">Live Preview</div>
      </header>

      <main class="main">
        <section class="left-panel">
          <h2 class="headline">Сохраняйте ссылки и делайте скриншоты в один клик.</h2>
          <p class="lead">
            Вставьте любую ссылку, создайте снимок страницы и отправьте её в WhatsApp без лишних действий.
          </p>

          <div class="input-area">
            <input
              id="urlInput"
              class="url-input"
              type="text"
              value="https://example.com"
              placeholder="Вставьте ссылку..."
              aria-label="Ссылка"
            />
          </div>

          <div class="actions">
            <button id="previewBtn" class="primary" type="button">Сделать скриншот</button>
            <button id="copyBtn" class="secondary" type="button">Копировать ссылку</button>
            <button id="whatsappBtn" class="secondary" type="button">Отправить в WhatsApp</button>
          </div>

          <div class="stats">
            <div class="stat">
              <span class="value">1-click</span>
              <span class="label">Скрин</span>
            </div>
            <div class="stat">
              <span class="value">Open</span>
              <span class="label">WhatsApp</span>
            </div>
            <div class="stat">
              <span class="value">Auto</span>
              <span class="label">Копия</span>
            </div>
          </div>
        </section>

        <aside class="right-panel">
          <div id="previewCard" class="card-shell preview-card" aria-live="polite">
            <img id="previewImage" class="preview-image" alt="Скриншот страницы" />
            <div class="preview-body">
              <div class="preview-badge">Page preview</div>
              <h3 id="previewTitle" class="preview-title">Название страницы</h3>
              <a id="previewLink" class="preview-link" href="#" target="_blank" rel="noreferrer">Ссылка</a>
            </div>
          </div>

          <div class="history">
            <h4 class="history-title">Последние ссылки</h4>
            <div id="historyList" class="history-list"></div>
          </div>
        </aside>
      </main>
    </div>

    <script>
      const urlInput = document.getElementById('urlInput');
      const previewCard = document.getElementById('previewCard');
      const previewImage = document.getElementById('previewImage');
      const previewTitle = document.getElementById('previewTitle');
      const previewLink = document.getElementById('previewLink');
      const historyList = document.getElementById('historyList');
      const STORAGE_KEY = 'nuurayteams_history';

      function normalizeUrl(value) {
        const trimmed = String(value || '').trim();
        if (!trimmed) return '';
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        return `https://${trimmed}`;
      }

      function readHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (_) {
          return [];
        }
      }

      function saveHistory(url) {
        const history = readHistory();
        const next = [url, ...history.filter(item => item !== url)].slice(0, 5);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        renderHistory();
      }

      function renderHistory() {
        const history = readHistory();

        if (!history.length) {
          historyList.innerHTML = '<span class="history-empty">Пока нет ссылок</span>';
          return;
        }

        historyList.innerHTML = history
          .map(item => `<button class="history-item" type="button" data-url="${item}">${item}</button>`)
          .join('');

        historyList.querySelectorAll('.history-item').forEach(button => {
          button.addEventListener('click', () => {
            const value = button.getAttribute('data-url');
            urlInput.value = value;
            makePreview();
          });
        });
      }

      async function makePreview() {
        const url = normalizeUrl(urlInput.value);
        if (!url) {
          alert('Введите ссылку');
          return;
        }

        try {
          const response = await fetch('/api/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });

          const data = await response.json();

          if (!response.ok) {
            alert(data.error || 'Ошибка загрузки');
            return;
          }

          previewImage.src = data.image;
          previewTitle.textContent = data.title || 'Без названия';
          previewLink.href = data.url;
          previewLink.textContent = data.url;
          previewCard.classList.add('visible');

          saveHistory(data.url);
        } catch (error) {
          alert('Ошибка соединения с сервером');
        }
      }

      document.getElementById('previewBtn').addEventListener('click', makePreview);

      document.getElementById('copyBtn').addEventListener('click', async () => {
        const url = normalizeUrl(urlInput.value);
        if (!url) {
          alert('Введите ссылку');
          return;
        }

        try {
          await navigator.clipboard.writeText(url);
          alert('Ссылка скопирована');
        } catch (_) {
          alert('Не удалось скопировать ссылку');
        }
      });

      document.getElementById('whatsappBtn').addEventListener('click', () => {
        const url = normalizeUrl(urlInput.value);
        if (!url) {
          alert('Введите ссылку');
          return;
        }

        const text = encodeURIComponent(url);
        window.open(`https://wa.me/?text=${text}`, '_blank');
      });

      renderHistory();
    </script>
  </body>
</html>
